# Photo gallery at /gallery. Easiest to edit in quantt.ca/admin > Gallery, where a zip of photos becomes a new set.
# Sets show newest first by `date` (YYYY-MM). The home hero rotates, in random order, through every photo
# in every set unless the photo is hidden or has `hero: false`.
#
# events:
#   - title: "Event name"
#     date: "2026-10"            # year and month, for order and the "October 2026" label
#     place: "City"              # optional
#     result: "1st place"        # optional
#     photos:                    # first photo is the large lead shot
#       - src: "/gallery/<set>/01.jpg"   # files live in public/gallery/<set>/; a 01-sm.jpg beside it is the grid thumbnail
#         alt: "What the photo shows"    # optional, defaults to the set title
#         hidden: true           # optional: keep it off the site (gallery and hero)
#         hero: false            # optional: keep it out of the home hero only
#         position: "60% 25%"    # optional: the point to keep in frame when the home page or the
#                                # gallery grid crops it (across, down). Set by admin's auto crop
#                                # (around faces) or its Crop button. Default "50% 50%".

# Photo the home page opens on: "random" (a different one each visit) or a photo's src.
heroStart: "random"

