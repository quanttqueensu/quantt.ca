<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QUANTT Admin</title>
<link rel="icon" href="/favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
  :root { --blue: #295caa; --blue-hover: #1d4682; --navy: #0f2547; --ink: #101213; --text: #373a3c; --meta: #696969;
    --line: #d0d1d4; --panel: #f2f5fa; --bg: #fff; --red: #b42318; --green: #1a7f37; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: var(--panel); }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--navy); color: #fff; }
  header img { height: 26px; }
  header .who { margin-left: auto; font-size: 13px; opacity: .85; }
  header a { color: #fff; font-size: 13px; }
  #deploy { font-size: 13px; padding: 3px 10px; border-radius: 99px; background: rgba(255,255,255,.12); }
  #deploy:empty { display: none; }
  .layout { display: grid; grid-template-columns: 210px 1fr; min-height: calc(100vh - 46px); }
  nav { background: #fff; border-right: 1px solid var(--line); padding: 12px 0; }
  nav button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 20px; font: inherit; color: var(--ink); cursor: pointer; }
  nav button:hover { background: var(--panel); }
  nav button.on { color: var(--blue); font-weight: 600; box-shadow: inset 3px 0 var(--blue); background: var(--panel); }
  nav button .dot { display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: #e09b00; vertical-align: middle; }
  main { padding: 24px 28px 120px; max-width: 980px; width: 100%; }
  h1 { margin: 0 0 4px; font-size: 22px; color: var(--ink); }
  .sub { margin: 0 0 18px; color: var(--meta); font-size: 13px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  label.f { display: block; margin-bottom: 12px; }
  label.f > span { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--meta); margin-bottom: 4px; }
  label.f.check { display: flex; gap: 8px; align-items: center; }
  label.f.check > span { margin: 0; }
  input[type=text], input[type=url], input[type=date], input[type=month], input[type=number], select, textarea { width: 100%; font: inherit; color: var(--ink); padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--blue); outline-offset: -1px; border-color: var(--blue); }
  textarea { min-height: 70px; resize: vertical; }
  textarea.md, textarea.raw { min-height: 260px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .grid2 > .wide { grid-column: 1 / -1; }
  button.b { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 4px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  button.b:hover { border-color: var(--blue); color: var(--blue); }
  button.b.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button.b.primary:hover { background: var(--blue-hover); color: #fff; }
  button.b.danger { color: var(--red); }
  button.b.small { padding: 3px 9px; font-size: 13px; }
  button.b:disabled { opacity: .5; cursor: default; }
  .item { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; background: #fff; }
  .item > .head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; }
  .item > .head .t { flex: 1; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item > .head .m { color: var(--meta); font-size: 13px; }
  .item > .body { padding: 4px 12px 8px; border-top: 1px solid var(--line); }
  .item.closed > .body { display: none; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 2px; margin: 0 0 12px; }
  legend { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--meta); padding: 0 4px; }
  .asset { display: flex; gap: 10px; align-items: center; }
  .asset .thumb { width: 72px; height: 48px; flex: none; border: 1px solid var(--line); border-radius: 4px; background: var(--panel) center / contain no-repeat; display: grid; place-items: center; font-size: 11px; color: var(--meta); }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--meta); background: var(--panel); }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--panel); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: #fff4d6; color: #7a5200; margin-left: 6px; font-weight: 600; }
  .tag.del { background: #fde8e7; color: var(--red); }
  .err { color: var(--red); font-size: 13px; margin: 4px 0 10px; }
  .muted { color: var(--meta); }
  .back { margin-bottom: 14px; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: none; align-items: center; gap: 12px; padding: 12px 24px; background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(15,37,71,.08); }
  #bar.on { display: flex; }
  #bar .grow { font-size: 14px; }
  #bar input { max-width: 420px; }
  #toast { position: fixed; right: 20px; bottom: 80px; z-index: 7; max-width: 380px; padding: 12px 16px; border-radius: 6px; background: var(--navy); color: #fff; font-size: 14px; display: none; }
  #toast.on { display: block; }
  #toast.bad { background: var(--red); }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 6px 0 12px; }
  .photo { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; }
  .photo .img { aspect-ratio: 3 / 2; background: var(--panel) center / cover no-repeat; position: relative; }
  .photo .img .lead { position: absolute; left: 6px; top: 6px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--navy); color: #fff; }
  .photo.off .img { opacity: .35; filter: grayscale(1); }
  .photo .opts { padding: 6px 8px; font-size: 13px; display: grid; gap: 2px; }
  .photo .opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .photo .opts .row { justify-content: space-between; margin-top: 2px; }
  .photo .opts button { border: 0; background: none; padding: 0; font: inherit; font-size: 12px; color: var(--blue); cursor: pointer; }
  .photo .opts button.danger { color: var(--red); }
  .drop { border: 1px dashed var(--line); border-radius: 6px; padding: 14px; background: #fff; }
  .progress { font-size: 13px; color: var(--meta); margin-top: 8px; }
  .opts-line { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; margin: 6px 0; }
  .opts-line label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .overlay { position: fixed; inset: 0; z-index: 8; background: rgba(15,37,71,.55); display: grid; place-items: center; padding: 20px; }
  .sheet { background: #fff; border-radius: 8px; width: min(1100px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; }
  .sheet > .top, .sheet > .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 14px 18px; }
  .sheet > .top { border-bottom: 1px solid var(--line); }
  .sheet > .top h2 { margin: 0 0 2px; font-size: 18px; color: var(--ink); }
  .sheet > .top p { margin: 0; font-size: 13px; }
  .sheet > .foot { border-top: 1px solid var(--line); }
  .sheet > .mid { overflow: auto; padding: 14px 18px; }
  .grow { flex: 1; }
  .lab { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--meta); margin-bottom: 6px; }
  .grp { margin-bottom: 16px; }
  .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .pick { position: relative; aspect-ratio: 3 / 2; padding: 0; border: 0; border-radius: 4px; cursor: pointer; background: var(--panel) center / cover no-repeat; opacity: .4; }
  .pick.on { opacity: 1; box-shadow: 0 0 0 3px var(--blue); }
  .pick:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; }
  .pick .tick { position: absolute; right: 6px; top: 6px; width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.9); color: transparent; font-size: 12px; line-height: 20px; text-align: center; }
  .pick.on .tick { background: var(--blue); color: #fff; }
  .pick .best { position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--navy); color: #fff; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--blue); color: #fff; }
  .crop { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 18px; align-items: start; }
  .crop .stage { position: relative; justify-self: center; cursor: crosshair; touch-action: none; }
  .crop .stage img { display: block; max-width: 100%; max-height: 62vh; user-select: none; }
  .crop .dot { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 2px var(--blue), 0 1px 6px rgba(0,0,0,.4); pointer-events: none; }
  .crop .pv { background: var(--panel) center / cover no-repeat; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 12px; }
  @media (max-width: 760px) {
    .crop { grid-template-columns: 1fr; }
    .layout { grid-template-columns: 1fr; }
    nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 0; }
    nav button { white-space: nowrap; width: auto; padding: 12px 14px; }
    nav button.on { box-shadow: inset 0 -3px var(--blue); }
    main { padding: 16px 16px 140px; }
    .grid2 { grid-template-columns: 1fr; }
    header .who { display: none; }
    #bar { flex-wrap: wrap; padding: 10px 16px; }
    #bar input { max-width: none; }
  }
</style>
</head>
<body>
<header>
  <img src="/images/logos/quantt-full-white.png" alt="QUANTT">
  <strong>Admin</strong>
  <span id="deploy"></span>
  <span class="who" id="who"></span>
  <a href="/" target="_blank" rel="noopener">View site</a>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><p class="muted">Loading…</p></main>
</div>
<div id="bar">
  <span class="grow" id="barText"></span>
  <input type="text" id="barMsg" placeholder="What changed? (optional)">
  <button class="b" id="discard">Discard</button>
  <button class="b primary" id="publish">Publish</button>
</div>
<div id="toast"></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k in el && k !== "list") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
  return el;
}
const slug = (s) => String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "untitled";
let toastTimer;
function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg; t.className = "on" + (bad ? " bad" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = ""), bad ? 9000 : 4000);
}
async function api(path, init) {
  const res = await fetch("/admin/api" + path, init);
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    throw new Error(j.error || `Request failed (${res.status})`);
  }
  return (res.headers.get("content-type") || "").includes("json") ? res.json() : res.text();
}

/* ---------- repo state ---------- */
// files: path -> blob sha on main. text: path -> loaded text. pending: path -> change waiting to be published.
const S = { files: {}, text: {}, pending: new Map(), previews: {}, invalid: new Set(), section: "settings", view: null };

async function refreshFiles() { S.files = (await api("/files")).files; }
async function load(path) {
  if (S.pending.has(path)) { const p = S.pending.get(path); if (p.text !== undefined) return p.text; }
  if (!(path in S.text)) S.text[path] = S.files[path] ? await api("/file?path=" + encodeURIComponent(path)) : null;
  return S.text[path];
}
const exists = (path) => (S.pending.has(path) ? !S.pending.get(path).delete : !!S.files[path]);
// Stage new text for a file; dropping it again when it matches what's on main.
function stage(path, text) {
  const orig = S.text[path] ?? null;
  if (text === orig) S.pending.delete(path);
  else S.pending.set(path, { path, text, sha: S.files[path] ?? null });
  updateBar();
}
function stageDelete(path) {
  if (!S.files[path]) S.pending.delete(path);
  else S.pending.set(path, { path, delete: true, sha: S.files[path] });
  updateBar();
}
function stageUpload(path, base64, blob) {
  S.pending.set(path, { path, base64, sha: S.files[path] ?? null });
  S.previews[path] = URL.createObjectURL(blob);
  updateBar();
}
function publicUrl(path) { return "/" + path.replace(/^public\//, ""); }
function repoPath(url) { return url && url.startsWith("/") ? "public" + url : null; }
function previewSrc(url) {
  const p = repoPath(url);
  return (p && S.previews[p]) || url;
}

/* ---------- YAML / front matter ---------- */
// Core schema: dates stay strings, as the site reads them.
const YAML_OPTS = { schema: jsyaml.CORE_SCHEMA };
const DUMP = { ...YAML_OPTS, lineWidth: -1, noRefs: true, forceQuotes: true, quotingType: '"' };
const loadYaml = (t) => jsyaml.load(t, YAML_OPTS);
// The hand-written files explain their format in comments. Keep the comments (and blank lines) above each top-level
// key, and the ones at the top of the file, when the editor rewrites it.
function dumpYaml(obj, orig, spaced) {
  let body = jsyaml.dump(obj, DUMP);
  // A blank line between top-level list entries, as the hand-written files have.
  if (spaced) body = body.replace(/\n(\s{0,2}- )/g, (m, d, i, s) => (/:\n$/.test(s.slice(0, i + 1)) ? m : "\n\n" + d));
  const notes = {}; let block = [], head = null;
  for (const line of (orig || "").split("\n")) {
    if (/^\s*(#.*)?$/.test(line)) { block.push(line); continue; }
    const key = (line.match(/^([\w-]+):/) || [])[1];
    if (head === null) { head = block; block = []; }
    if (key) notes[key] = block;
    block = [];
  }
  if (head === null) head = block;
  // Comments above the first key belong to the file, not that key.
  const lines = body.replace(/\n$/, "").split("\n").flatMap((line, i) => {
    const key = (line.match(/^([\w-]+):/) || [])[1];
    return key && i > 0 && notes[key] ? [...notes[key], line] : [line];
  });
  return [...head, ...lines].join("\n") + "\n";
}
function parseMd(text) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/.exec(text || "");
  if (!m) return { fm: {}, body: text || "" };
  return { fm: loadYaml(m[1]) || {}, body: m[2].replace(/^\r?\n/, "") };
}
function dumpMd(fm, body) {
  return "---\n" + jsyaml.dump(fm, DUMP) + "---\n" + (body && body.trim() ? "\n" + body.replace(/\s*$/, "\n") : "");
}

/* ---------- form fields ---------- */
// A field: { key, label, type, options, fields, dir, wide, hint, list }. render() edits obj in place and calls onChange.
function setVal(obj, key, v, blankDeletes) {
  if (v === "" || v == null || (Array.isArray(v) && !v.length)) { if (blankDeletes || !(key in obj)) delete obj[key]; else obj[key] = Array.isArray(obj[key]) ? [] : ""; }
  else obj[key] = v;
}
function field(f, obj, onChange, ctx) {
  const val = obj[f.key];
  const wrap = (input, cls) => h("label", { class: "f" + (cls ? " " + cls : "") + (f.wide ? " wide" : "") }, h("span", {}, f.label), input, f.hint ? h("div", { class: "muted", style: "font-size:12px;margin-top:3px" }, f.hint) : null);
  const changed = (v) => { setVal(obj, f.key, v, f.blankDeletes); onChange(); };
  switch (f.type) {
    case "bool": {
      const i = h("input", { type: "checkbox", checked: !!val, onchange: () => { if (i.checked || !f.blankDeletes) obj[f.key] = i.checked; else delete obj[f.key]; onChange(); } });
      return h("label", { class: "f check" + (f.wide ? " wide" : "") }, i, h("span", {}, f.label));
    }
    case "textarea": case "markdown":
      return wrap(h("textarea", { class: f.type === "markdown" ? "md" : "", value: val ?? "", oninput: (e) => changed(e.target.value) }));
    case "number":
      return wrap(h("input", { type: "number", value: val ?? "", oninput: (e) => changed(e.target.value === "" ? "" : Number(e.target.value)) }));
    case "select": {
      const opts = [...new Set([...(typeof f.options === "function" ? f.options(ctx) : f.options), ...(val ? [val] : [])])];
      return wrap(h("select", { onchange: (e) => changed(e.target.value) }, h("option", { value: "" }, "—"), opts.map((o) => h("option", { value: o, selected: o === val }, o))));
    }
    case "lines":
      return wrap(h("textarea", { value: (val || []).join("\n"), oninput: (e) => changed(e.target.value.split("\n").map((s) => s.trim()).filter(Boolean)) }), null);
    case "tags":
      return wrap(h("input", { type: "text", value: (val || []).join(", "), oninput: (e) => changed(e.target.value.split(",").map((s) => s.trim()).filter(Boolean)) }));
    case "asset": return wrap(assetInput(f, obj, onChange, ctx));
    case "object": {
      // Attached to the parent only once it has a value, so opening a form never adds an empty block.
      const child = obj[f.key] && typeof obj[f.key] === "object" ? obj[f.key] : {};
      const sub = () => { if (Object.keys(child).length) obj[f.key] = child; else delete obj[f.key]; onChange(); };
      return h("fieldset", { class: "wide" }, h("legend", {}, f.label), h("div", { class: "grid2" }, f.fields.map((g) => field(g, child, sub, [child, ...ctx]))));
    }
    case "list": return listInput(f, obj, onChange, ctx);
    default: {
      const id = f.suggest ? "dl-" + Math.random().toString(36).slice(2) : null;
      const input = h("input", { type: f.type === "date" ? "date" : "text", list: id, value: val ?? "", placeholder: f.placeholder || "", oninput: (e) => changed(e.target.value) });
      return wrap(id ? [input, h("datalist", { id }, f.suggest(ctx).map((s) => h("option", { value: s })))] : input);
    }
  }
}

// A photo, logo or PDF: a path on the site, plus an upload that stages the file under f.dir.
function assetInput(f, obj, onChange, ctx) {
  const thumb = h("div", { class: "thumb" });
  const text = h("input", { type: "text", value: obj[f.key] ?? "", placeholder: f.placeholder || "/images/… or https://…", oninput: () => { setVal(obj, f.key, text.value.trim()); show(); onChange(); } });
  const file = h("input", { type: "file", accept: f.accept || "image/*,application/pdf", style: "display:none", onchange: async () => {
    const picked = file.files[0]; if (!picked) return;
    try {
      const dir = typeof f.dir === "function" ? f.dir(ctx) : f.dir;
      const { blob, name } = await prepareUpload(picked, f.resize !== false);
      let path = `${dir}/${name}`;
      for (let n = 2; exists(path) && !S.pending.get(path)?.base64; n++) path = `${dir}/${name.replace(/(\.\w+)$/, `-${n}$1`)}`;
      stageUpload(path, await toBase64(blob), blob);
      text.value = publicUrl(path); setVal(obj, f.key, text.value); show(); onChange();
    } catch (e) { toast(e.message, true); }
    file.value = "";
  } });
  function show() {
    const v = text.value.trim();
    thumb.style.backgroundImage = ""; thumb.textContent = "";
    if (!v) thumb.textContent = "none";
    else if (/\.pdf$/i.test(v)) thumb.textContent = "PDF";
    else if (/^https?:/.test(v) && !/\.(png|jpe?g|webp|gif|svg)$/i.test(v)) thumb.textContent = "link";
    else thumb.style.backgroundImage = `url("${previewSrc(v).replace(/"/g, "%22")}")`;
  }
  show();
  return h("div", { class: "asset" }, thumb, text, h("button", { class: "b small", type: "button", onclick: (e) => { e.preventDefault(); file.click(); } }, "Upload"), file);
}
const toBase64 = (blob) => new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = bad; r.readAsDataURL(blob); });
// Photos over 2000px are scaled down (as JPEG) so pages stay fast; logos, SVGs and PDFs go up as they are.
async function prepareUpload(file, resize) {
  if (file.size > 8 * 1024 * 1024) throw new Error(`${file.name} is over 8 MB.`);
  const ext = (file.name.match(/\.(\w+)$/) || [, ""])[1].toLowerCase();
  if (!/^(png|jpe?g|webp|gif|svg|pdf)$/.test(ext)) throw new Error("Upload a PNG, JPG, WebP, GIF, SVG or PDF.");
  const base = slug(file.name.replace(/\.\w+$/, ""));
  if (resize && /^(jpe?g|png|webp)$/.test(ext)) {
    const img = await createImageBitmap(file).catch(() => null);
    if (img && Math.max(img.width, img.height) > 2000) {
      const k = 2000 / Math.max(img.width, img.height);
      const c = h("canvas", { width: Math.round(img.width * k), height: Math.round(img.height * k) });
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.85));
      return { blob, name: base + ".jpg" };
    }
  }
  return { blob: file, name: `${base}.${ext === "jpeg" ? "jpg" : ext}` };
}

// A list of entries (partners, events, wins, attachments): each one folds open, moves up or down, or is removed.
function listInput(f, obj, onChange, ctx) {
  const arr = Array.isArray(obj[f.key]) ? obj[f.key] : [];
  // Like objects, a missing list is attached on the first entry; an optional one goes away when emptied.
  const sync = () => { if (arr.length || !f.blankDeletes) obj[f.key] = arr; else delete obj[f.key]; onChange(); };
  const box = h("div");
  const open = new Set();
  function draw() {
    box.replaceChildren(
      ...arr.map((item, i) => {
        const title = h("span", { class: "t" }, f.itemLabel(item) || "(untitled)");
        const meta = h("span", { class: "m" }, f.itemMeta ? f.itemMeta(item) : "");
        const btn = (label, fn, cls) => h("button", { class: "b small " + (cls || ""), type: "button", onclick: (e) => { e.stopPropagation(); fn(); } }, label);
        // A field with when(item) shows only while it applies, e.g. PDF-only options.
        const shown = [];
        const refresh = () => shown.forEach(([g, el]) => { el.hidden = !g.when(item); });
        const body = h("div", { class: "body" }, h("div", { class: "grid2" }, f.fields.map((g) => {
          const el = field(g, item, () => { title.textContent = f.itemLabel(item) || "(untitled)"; if (f.itemMeta) meta.textContent = f.itemMeta(item); refresh(); onChange(); }, [item, ...ctx]);
          if (g.when) shown.push([g, el]);
          return el;
        })));
        refresh();
        const el = h("div", { class: "item" + (open.has(item) ? "" : " closed") },
          h("div", { class: "head", onclick: () => { el.classList.toggle("closed"); el.classList.contains("closed") ? open.delete(item) : open.add(item); } },
            title, meta,
            i > 0 && btn("↑", () => { arr.splice(i - 1, 0, ...arr.splice(i, 1)); sync(); draw(); }),
            i < arr.length - 1 && btn("↓", () => { arr.splice(i + 1, 0, ...arr.splice(i, 1)); sync(); draw(); }),
            btn("Remove", () => { if (confirm(`Remove “${f.itemLabel(item) || "this entry"}”?`)) { arr.splice(i, 1); sync(); draw(); } }, "danger")),
          body);
        return el;
      }),
      h("button", { class: "b small", type: "button", onclick: () => { const item = f.newItem ? f.newItem() : {}; f.addFirst ? arr.unshift(item) : arr.push(item); open.add(item); sync(); draw(); } }, "+ " + (f.addLabel || "Add"))
    );
  }
  draw();
  return h("fieldset", { class: "wide" }, h("legend", {}, f.label), box);
}

const LIBS = {
  heif: "https://cdn.jsdelivr.net/npm/libheif-js@1.18.2/libheif-wasm/libheif-bundle.mjs",
  vision: "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14",
  face: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
};
const PHOTO_RE = /\.(jpe?g|png|webp|heic|heif)$/i;

// Zips are read in the browser, lazily: only the central directory is read up front and each photo when it's needed,
// so a 1 GB zip never sits in memory. Entries are stored or deflated (DecompressionStream). Folders, macOS metadata
// and anything that isn't a file are skipped.
async function unzip(file) {
  const tailLen = Math.min(file.size, 65557);
  const tail = new DataView(await file.slice(file.size - tailLen).arrayBuffer());
  let end = -1;
  for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { end = i; break; }
  if (end < 0) throw new Error(`${file.name} isn't a zip file.`);

async function addPhotos(set, files, progress) {
  const items = [];

    if (/\.zip$/i.test(f.name) || f.type.includes("zip")) items.push(...(await unzip(f)));

  if (!photos.length) throw new Error("No photos found (JPG, PNG, WebP or HEIC).");
  // Folder names under the zip's top folder say what the photos are ("Macro Regime").
  const dirs = photos.map((p) => p.path.split("/").slice(0, -1));
  const common = dirs.reduce((c, d) => c.filter((x, i) => d[i] === x), dirs[0]).length;
  for (const [i, p] of photos.entries()) p.alt = dirs[i].length > common ? dirs[i].at(-1) : undefined;

  let chosen = photos, failed = [];

    const r = await analysePhotos(photos, progress);

    progress("");
    const pick = await choosePhotos(r.photos);

    chosen = r.photos.filter((p) => pick.has(p));
  }
  const dir = "public/gallery/" + (set.folder || slug(`${set.title}-${set.date}`));
  let n = Math.max(0, ...set.photos.map((p) => Number((p.src.match(/\/(\d+)\.jpg$/) || [])[1]) || 0));
  for (const [i, p] of chosen.entries()) {
    progress(`Saving photo ${i + 1} of ${chosen.length}…`);
    let img;
    try { img = await decodePhoto(await p.read(), p.name); } catch { failed.push(p.name); continue; }
    const position = galleryOpts.crop ? await autoCrop(img) : null;
    const full = await toJpeg(scaled(img, 2400), 0.85), thumb = await toJpeg(scaled(img, 800), 0.8);

    stageUpload(path, await toBase64(full), full);

    h("h2", { style: "margin:0 0 10px;font-size:16px;color:var(--ink)" }, "Add a photo set"),
    h("div", { class: "grid2" },
      h("label", { class: "f" }, h("span", {}, "Name"), nt), h("label", { class: "f" }, h("span", {}, "Month"), nd),
      h("label", { class: "f" }, h("span", {}, "Place (optional)"), np), h("label", { class: "f" }, h("span", {}, "Result (optional)"), nr),
      h("label", { class: "f wide" }, h("span", {}, "Zip of photos"), h("div", { class: "drop" }, nf),
        h("div", { class: "muted", style: "font-size:12px;margin-top:3px" }, "JPG, PNG or iPhone HEIC. Photos are resized for the web here before upload, and start shown in the gallery and the home page rotation."))),
    optsLine(), err, h("div", { class: "row" }, add), prog);

  // Which photo the home page opens on: random each visit, or one chosen here.
  const startPhoto = data.heroStart && data.heroStart !== "random" ? data.events.flatMap((e) => e.photos || []).find((p) => p.src === data.heroStart) : null;
  const startOk = startPhoto && !startPhoto.hidden && startPhoto.hero !== false;
  const setStart = (src) => { if (src) data.heroStart = src; else data.heroStart = "random"; save(); redraw(); };
  const radio = (on, label, onclick) => h("label", {}, h("input", { type: "radio", name: "heroStart", checked: on, onchange: onclick }), label);
  const home = h("div", { class: "card" },
    h("h2", { style: "margin:0 0 8px;font-size:16px;color:var(--ink)" }, "Home page opening photo"),
    h("div", { class: "opts-line" },
      radio(!startPhoto, "A random photo each visit", () => setStart(null)),
      radio(!!startPhoto, "Always this photo", () => { if (!startPhoto) toast("Click “Start home page here” on a photo below to choose it."); redraw(); })),
    startPhoto
      ? h("div", { class: "row", style: "margin-top:6px" },
          h("div", { class: "asset" }, h("div", { class: "thumb", style: `background-image:url("${previewSrc(thumbOf(startPhoto.src)).replace(/"/g, "%22")}");background-size:cover;background-position:${startPhoto.position || "50% 50%"}` })),
          h("span", { class: startOk ? "muted" : "err", style: "font-size:13px" }, startOk ? "Chosen with “Start home page here” on a photo below." : "This photo is hidden or out of the home page rotation, so the home page opens on a random photo."))
      : h("div", { class: "muted", style: "font-size:13px;margin-top:4px" }, "To always open on one photo, click “Start home page here” on it below."));

  const sets = byDate().map((set) => {
    set.photos = Array.isArray(set.photos) ? set.photos : [];
    const key = set.title + set.date;
    const shown = set.photos.filter((p) => !p.hidden).length;
    const meta = () => `${monthText(set.date)} · ${shown} of ${set.photos.length} shown`;
    const one = (k, label, attrs = {}) => h("label", { class: "f" }, h("span", {}, label), h("input", { type: attrs.type || "text", value: set[k] ?? "", oninput: (e) => { const v = e.target.value.trim(); if (v) set[k] = v; else if (k === "place" || k === "result") delete set[k]; save(); } }));
    const sp = h("div", { class: "progress" });
    const more = h("input", { type: "file", multiple: true, accept: ".zip,application/zip,image/*", style: "display:none", onchange: async () => {
      try { const r = await addPhotos(set, more.files, (m) => (sp.textContent = m)); more.value = ""; if (!r) return; save(); toast(`${r.added} photos added.`); redraw(); }
      catch (e) { sp.textContent = ""; toast(e.message, true); }
    } });
    // Look-alikes among the set's photos: the ones you pick are shown, the rest hidden (not deleted).
    const dupes = async () => {
      const r = await analysePhotos(setItems(set), (m) => (sp.textContent = m));
      sp.textContent = "";
      const pick = await choosePhotos(r.photos, { action: "Show" });
      for (const p of r.photos) URL.revokeObjectURL(p.preview);
      if (!pick) return;
      for (const p of r.photos) { if (pick.has(p)) delete p.photo.hidden; else p.photo.hidden = true; }
      save(); redraw();
      toast(`${pick.size} photos shown, ${r.photos.length - pick.size} hidden. Hidden ones can be ticked back on.`);
    };
    const cropAll = async () => {
      if (!confirm("Auto crop every photo in this set around the faces in it? This replaces crops set by hand on photos with faces.")) return;
      let i = 0, found = 0;
      for (const it of setItems(set)) {
        sp.textContent = `Cropping photo ${++i} of ${set.photos.length}…`;
        try { const img = await decodePhoto(await it.read(), it.name); const pos = await autoCrop(img); img.close?.(); if (pos) { it.photo.position = pos; found++; } } catch {}
      }
      sp.textContent = ""; save(); redraw();
      toast(`${found} photos cropped around faces. ${set.photos.length - found} with no faces kept their crop.`);
    };
    const grid = h("div", { class: "photos" }, set.photos.map((p, i) => {
      const tile = h("div", { class: "photo" + (p.hidden ? " off" : "") },
        h("div", { class: "img", style: `background-image:url("${previewSrc(thumbOf(p.src)).replace(/"/g, "%22")}");background-position:${p.position || "50% 50%"}` }, i === 0 && h("span", { class: "lead" }, "Lead")),
        h("div", { class: "opts" },
          h("label", {}, h("input", { type: "checkbox", checked: !p.hidden, onchange: (e) => { if (e.target.checked) delete p.hidden; else p.hidden = true; save(); redraw(); } }), "Show on site"),
          h("label", {}, h("input", { type: "checkbox", checked: p.hero !== false, disabled: !!p.hidden, onchange: (e) => { if (e.target.checked) delete p.hero; else p.hero = false; save(); } }), "Home page rotation"),
          p.hero !== false && !p.hidden && (data.heroStart === p.src
            ? h("div", { class: "row" }, h("span", { style: "font-size:12px;font-weight:600;color:var(--green)" }, "Home page starts here"), h("button", { type: "button", onclick: () => setStart(null) }, "Undo"))
            : h("div", { class: "row" }, h("button", { type: "button", onclick: () => setStart(p.src) }, "Start home page here"))),
          h("div", { class: "row" },
            i > 0 ? h("button", { type: "button", onclick: () => { set.photos.unshift(...set.photos.splice(i, 1)); save(); redraw(); } }, "Make lead") : h("span"),
            h("button", { type: "button", onclick: async () => {
              const r = await cropEditor(previewSrc(p.src), p.position);
              if (r === undefined) return;
              if (r) p.position = r; else delete p.position;
              save(); redraw();
            } }, "Crop"),
            h("button", { type: "button", class: "danger", onclick: () => {
              if (!confirm("Delete this photo from the site?")) return;
              set.photos.splice(i, 1);
              for (const f of [repoPath(p.src), repoPath(p.src.replace(/(\.\w+)$/, "-sm$1"))]) if (f && f.startsWith("public/gallery/") && exists(f)) { if (S.pending.get(f)?.base64) S.pending.delete(f); else stageDelete(f); }
              save(); redraw();
            } }, "Delete"))));
      return tile;
    }));
    const el = h("div", { class: "item" + (galleryOpen.has(key) ? "" : " closed") },
      h("div", { class: "head", onclick: () => { el.classList.toggle("closed"); el.classList.contains("closed") ? galleryOpen.delete(key) : galleryOpen.add(key); } },
        h("span", { class: "t" }, set.title || "(untitled)"), h("span", { class: "m" }, meta())),
      h("div", { class: "body" },
        h("div", { class: "grid2", style: "margin-top:10px" }, one("title", "Name"), one("date", "Month", { type: "month" }), one("place", "Place (optional)"), one("result", "Result (optional)")),
        h("div", { class: "row", style: "margin-bottom:4px" },
          h("span", { class: "muted grow", style: "font-size:13px" }, "Untick a photo to hide it. The lead photo shows large at the top of the set. Crop sets the spot that stays in frame."),
          h("button", { class: "b small", type: "button", onclick: () => more.click() }, "Add photos"), more,
          h("button", { class: "b small", type: "button", onclick: dupes }, "Find look-alikes"),
          h("button", { class: "b small", type: "button", onclick: cropAll }, "Auto crop all"),
          h("button", { class: "b small danger", type: "button", onclick: () => {
            if (!confirm(`Delete the whole “${set.title}” set and its photos?`)) return;
            data.events.splice(data.events.indexOf(set), 1);
            for (const p of set.photos) for (const f of [repoPath(p.src), repoPath(p.src.replace(/(\.\w+)$/, "-sm$1"))]) if (f && f.startsWith("public/gallery/") && exists(f)) { if (S.pending.get(f)?.base64) S.pending.delete(f); else stageDelete(f); }
            save(); redraw();
          } }, "Delete set")),
        optsLine(), sp, grid));
    return el;
  });
  return [...title(s.label, s.sub), home, form, h("h2", { style: "margin:20px 0 10px;font-size:16px;color:var(--ink)" }, "Sets"), ...sets];
}

/* ---------- publish ---------- */
function updateBar() {
  const n = S.pending.size;
  $("bar").classList.toggle("on", n > 0);
  $("barText").textContent = `${n} unpublished change${n === 1 ? "" : "s"}: ` + [...S.pending.keys()].map((p) => p.split("/").pop()).slice(0, 4).join(", ") + (n > 4 ? "…" : "");
  renderNav();
}
$("discard").onclick = () => {
  if (!confirm("Discard all unpublished changes?")) return;
  S.pending.clear(); S.invalid.clear(); S.view = null; updateBar(); render();
};
$("publish").onclick = async () => {
  if ([...S.invalid].some((p) => S.pending.has(p))) return toast("Fix the YAML error before publishing.", true);
  const btn = $("publish"); btn.disabled = true; btn.textContent = "Publishing…";
  const changes = [...S.pending.values()];
  const names = [...new Set(changes.map((c) => c.path.split("/").pop()))];
  const message = $("barMsg").value.trim() || `Edit ${names.slice(0, 3).join(", ")}${names.length > 3 ? ` and ${names.length - 3} more` : ""}`;
  try {
    const res = await api("/commit", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ message, changes }) });
    for (const c of changes) { if (c.text !== undefined) S.text[c.path] = c.text; if (c.delete) delete S.text[c.path]; }
    S.pending.clear(); $("barMsg").value = "";
    await refreshFiles();
    updateBar(); render();
    toast("Published. The site updates in about two minutes.");
    watchDeploy(res.sha);
  } catch (e) { toast(e.message, true); }
  btn.disabled = false; btn.textContent = "Publish";
};
async function watchDeploy(sha) {
  const el = $("deploy");
  el.textContent = "Building…";
  for (let i = 0; i < 24; i++) {
    await new Promise((r) => setTimeout(r, 10000));
    const { state } = await api("/deploy?sha=" + sha).catch(() => ({ state: "unknown" }));
    if (state === "live") { el.textContent = "Live ✓"; setTimeout(() => (el.textContent = ""), 15000); return; }
    if (state === "failed") { el.textContent = "Build failed"; toast("The site build failed. Your change is saved; ask in the website thread.", true); return; }
  }
  el.textContent = "";
}
window.addEventListener("beforeunload", (e) => { if (S.pending.size) { e.preventDefault(); e.returnValue = ""; } });

(async () => {
  try {
    const me = await api("/me");
    $("who").textContent = me.name;
    await refreshFiles();
    if (!S.files["content/achievements.yml"]) delete SECTIONS.achievements;
    if (!S.files["content/gallery.yml"]) delete SECTIONS.gallery;
    renderNav(); render();
  } catch (e) { $("main").replaceChildren(h("p", { class: "err" }, e.message)); }
})();
</script>
</body>
</html>
